<!doctype html><meta charset="utf-8"><title>深空指挥队伍编辑器</title>
<style>body{font:15px sans-serif;background:#101827;color:#eaf2ff;margin:18px}button,select,input,textarea{background:#091321;color:#fff;border:1px solid #5378a5;padding:7px;margin:4px}button{cursor:pointer}main{display:grid;grid-template-columns:230px 1fr;gap:14px}aside,section{background:#17243a;padding:12px;border-radius:9px}aside button{display:block;width:95%;text-align:left}.tab{display:none}.tab.on{display:block}img.preview{max-width:180px;max-height:220px;margin:5px;border:1px solid #5378a5}.face{max-width:70px;max-height:70px;vertical-align:middle}.row{border-bottom:1px solid #334966;padding:7px}.muted{color:#9fb4ca}</style>
<h1>深空指挥：队伍编辑器</h1><button onclick="openTeam()">打开队伍文件夹</button><button onclick="newRole()">新建角色</button><span id="status" class="muted">未打开</span><main><aside><h3>角色列表</h3><div id="roles">请先打开队伍文件夹</div></aside><div><nav><button onclick="tab('resource')">角色资源</button><button onclick="tab('dialogue')">对白编辑</button><button onclick="tab('team')">队伍配置</button></nav>
<section id="resource" class="tab on"><h2 id="roleTitle">请选择角色</h2><div id="images"></div><p>替换文件会覆盖队伍目录中固定名称的文件。</p><input id="newChara" type="file" accept="image/*"><button onclick="replaceFile('chara.png','newChara')">替换立绘</button><input id="newFace" type="file" accept="image/*"><button onclick="replaceFace()">替换默认头像</button><button onclick="deleteRole()">删除角色</button></section>
<section id="dialogue" class="tab"><h2>对白编辑</h2><label>事件 <select id="event" onchange="showDialogue()"></select></label><div id="dialogueRows"></div><button onclick="addLine()">添加台词</button><button onclick="saveDialogue()">保存对白</button></section>
<section id="team" class="tab"><h2>队伍配置</h2><pre id="teamText"></pre></section></div></main>
<script>
const $=x=>document.getElementById(x), events={command:'接收指令',move:'移动',attack:'攻击',hit:'受击',lost:'失能',skill:'技能',praise:'表扬',failed:'失败',idle:'闲聊',follow:'跟随',interaction:'互动'};let root=null,current=null,dialogue={},handles={};
async function openTeam(){if(!showDirectoryPicker){$('status').textContent='请使用支持文件夹访问的 Chrome/Edge';return}root=await showDirectoryPicker({mode:'readwrite'});$('status').textContent='已打开 '+root.name;await scan();}
async function scan(){let c=await root.getDirectoryHandle('chara',{create:true});$('roles').innerHTML='';handles={};for await(const [id,h] of c.entries()){if(h.kind==='directory'){handles[id]=h;let b=document.createElement('button');b.textContent=id;b.onclick=()=>selectRole(id);$('roles').appendChild(b)}}}
async function selectRole(id){current=id;$('roleTitle').textContent='角色 '+id;let d=handles[id];$('images').innerHTML='';for(const f of ['chara.png']){try{let h=await d.getFileHandle(f),file=await h.getFile(),url=URL.createObjectURL(file);$('images').innerHTML+=`<img class="preview" src="${url}" title="${f}">`}catch(e){}}try{let h=await d.getDirectoryHandle('face'),items=[];for await(const [n,x] of h.entries()){if(x.kind==='file'&&/\.(png|jpg|jpeg)$/i.test(n))items.push(n)}$('images').innerHTML+=`<p>头像：${items.map(x=>'<span>'+x+'</span>').join('　')}</p>`}catch(e){}await loadDialogue();}
async function loadDialogue(){dialogue={};if(!current)return;try{let h=await handles[current].getFileHandle('dialogue.lua'),f=await h.getFile();let s=await f.text();for(const k of Object.keys(events)){let m=s.match(new RegExp(k+'\\s*=\\s*\\{([\\s\\S]*?)\\}'));dialogue[k]=m?[...m[1].matchAll(/text\s*=\s*["']([^"']*)/g)].map(x=>x[1]):[]}}catch(e){}$('event').innerHTML=Object.entries(events).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');showDialogue();}
function showDialogue(){let e=$('event').value,a=dialogue[e]||[];$('dialogueRows').innerHTML=a.map((x,i)=>`<div class="row"><img class="face" id="face${i}"><input data-i="${i}" value="${x}" style="width:70%"><button onclick="this.parentNode.remove()">删除</button></div>`).join('');}
function addLine(){let e=$('event').value;(dialogue[e]??=[]).push('新台词');showDialogue();}
async function saveDialogue(){if(!current)return;let e=$('event').value;dialogue[e]=[...document.querySelectorAll('#dialogueRows input')].map(x=>x.value);let body='return {\n';for(const [k,a] of Object.entries(dialogue))body+='  '+k+'={'+a.map(x=>'{text="'+x.replaceAll('"','\\"')+'"}').join(',')+'},\n';body+='  enemy={}\n}\n';let h=await handles[current].getFileHandle('dialogue.lua',{create:true}),w=await h.createWritable();await w.write(body);await w.close();}
async function replaceFile(name,input){if(!current||!$(input).files[0])return;let h=await handles[current].getFileHandle(name,{create:true}),w=await h.createWritable();await w.write(await $(input).files[0].arrayBuffer());await w.close();selectRole(current)}
async function replaceFace(){if(!current||!$('newFace').files[0])return;let f=$('newFace').files[0],face=await handles[current].getDirectoryHandle('face',{create:true}),h=await face.getFileHandle(f.name,{create:true}),w=await h.createWritable();await w.write(await f.arrayBuffer());await w.close();selectRole(current)}
async function deleteRole(){if(current&&confirm('删除角色目录？')){await handles[current].remove({recursive:true});current=null;scan()}}
async function newRole(){if(!root)return;let id=prompt('输入新角色编号');if(!id)return;let c=await root.getDirectoryHandle('chara',{create:true}),d=await c.getDirectoryHandle(id,{create:true});await d.getDirectoryHandle('face',{create:true});await d.getFileHandle('dialogue.lua',{create:true});await scan();selectRole(id)}
function tab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}
</script>
