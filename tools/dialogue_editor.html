<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>对白工作室</title>
<style>
:root{color-scheme:dark;--bg:#0f151c;--panel:#18232e;--panel2:#202e3b;--line:#344759;--text:#e7edf4;--muted:#9eb0c0;--accent:#73c8ff;--good:#83dfb5;--bad:#ff9d91}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,"Microsoft YaHei",sans-serif}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}h1,h2,h3,p{margin:0}h1{font-size:22px}h2{font-size:16px}small,.muted{color:var(--muted)}main{max-width:1440px;margin:auto;padding:18px 24px}.toolbar{display:grid;grid-template-columns:1.2fr 1fr 1.5fr 1.5fr auto;gap:10px;align-items:end;margin-bottom:14px}label{display:grid;gap:6px;color:var(--muted);font-size:12px}select,input,textarea,button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:wait}textarea{width:100%;resize:vertical;min-height:60px;line-height:1.55}.layout{display:grid;grid-template-columns:290px minmax(0,1fr) 280px;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}.panel h2{margin-bottom:10px}.events{display:grid;gap:5px;max-height:calc(100vh - 220px);overflow:auto}.event{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 9px;border:1px solid transparent;border-radius:6px;text-align:left;background:transparent}.event:hover{background:var(--panel2)}.event.active{border-color:var(--accent);background:#213849}.event span:last-child{font-size:11px;color:var(--muted)}.editor-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.actions{display:flex;gap:6px;flex-wrap:wrap}.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:9px;align-items:start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px}.row-num{color:var(--muted);padding-top:10px;text-align:center}.row-actions{display:flex;gap:4px}.row-actions button{padding:6px 8px}.avatar{width:42px;height:42px;object-fit:cover;border-radius:6px;border:1px solid #63798b;background:#101820}.preview{display:grid;gap:12px}.preview-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center}.preview-card img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid #63798b}.preview-card div{min-width:0}.preview-card strong{display:block;margin-bottom:4px}.hint{color:var(--muted);line-height:1.65;font-size:12px}.status{color:var(--good);max-width:540px;text-align:right}.status.bad{color:var(--bad)}.empty{padding:36px;text-align:center;color:var(--muted)}.chip{display:inline-block;padding:3px 7px;background:#2b4151;border-radius:12px;color:#c8eaff;font-size:11px}.path{overflow-wrap:anywhere;font-size:11px;color:var(--muted);line-height:1.4}.warning{color:#ffd08a;background:#3c3020;border:1px solid #765c32;padding:8px;border-radius:7px;font-size:12px;line-height:1.5}.hidden{display:none}.roster{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.speaker{display:flex;gap:7px;align-items:center;min-width:130px;padding:6px;background:#16212b;border:1px solid var(--line);border-radius:7px}.speaker img{width:40px;height:40px;object-fit:cover;border-radius:5px;background:#0d141b}.speaker strong,.speaker small{display:block;white-space:nowrap}.speaker strong{font-size:12px}.speaker small{font-size:10px}.dialogue-pair,.scene-line{display:grid;grid-template-columns:140px minmax(0,1fr);gap:7px;align-items:start}.scene-edit{display:grid;gap:6px}@media(max-width:1050px){.layout{grid-template-columns:230px minmax(0,1fr)}.preview{grid-column:1/-1}.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){header{padding:14px;display:block}header .status{text-align:left;margin-top:8px}main{padding:12px}.layout{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.events{max-height:none}.row{grid-template-columns:36px minmax(0,1fr)}.dialogue-pair,.scene-line{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>对白工作室</h1><small>Dialogue Studio · 使用游戏实际角色/皮肤头像预览</small></div><div id="status" class="status" role="status" aria-live="polite">选择 rts_game 或 teams 文件夹开始</div></header>
<main>
  <section class="panel" style="margin-bottom:14px"><div class="toolbar">
    <button id="open">选择游戏目录</button>
    <label>来源<select id="source"><option value="character">角色对白</option><option value="advisor">队伍顾问 / 战前对白</option></select></label>
    <label>队伍<select id="team"></select></label>
    <label>皮肤<select id="skin"></select></label>
    <label>角色<select id="chara"></select></label>
  </div><div id="context" class="path"></div><div id="advisorRoster" class="roster hidden"></div><div id="skinNote" class="warning hidden"></div></section>
  <div class="layout">
    <section class="panel"><h2>对白事件</h2><div id="events" class="events"></div></section>
    <section class="panel"><div class="editor-head"><div><h2 id="eventTitle">请选择事件</h2><small id="eventPath"></small></div><div class="actions"><button id="add" disabled>添加台词</button><button id="reload" disabled>重新载入</button></div></div><div id="rows" class="rows"><div class="empty">连接目录并选择角色后编辑</div></div></section>
    <section class="panel preview"><h2>游戏头像预览</h2><div id="preview"></div><p class="hint">头像按游戏运行时 `Pilots.line` / `face_img_path` 的事件映射选择。皮肤只替换头像和立绘，台词仍保存到角色原皮目录。</p><p class="hint">支持文本中的 `{commander}`、`{player_commander}`、`{enemy_commander}`、`{opponent_commander}` 和 `%s` 占位符。</p></section>
  </div>
</main>
<script>
const EVENTS=[
  ["friendly.ready","我方 · 待机完成"],["friendly.interaction","我方 · 互动"],["friendly.command","我方 · 接收命令"],["friendly.attack","我方 · 攻击"],["friendly.hit","我方 · 受击"],["friendly.energy","我方 · 能量不足"],["friendly.supplied","我方 · 补给完成"],["friendly.return_battle","我方 · 返回战场"],["friendly.repair_done","我方 · 修理完成"],["friendly.failed","我方 · 指令失败"],["friendly.skill","我方 · 必杀技"],["friendly.lost","我方 · 失能"],["friendly.idle","我方 · 闲聊"],["friendly.praise","我方 · 夸奖"],["friendly.camera_follow_start","我方 · 镜头跟随开始"],["friendly.camera_follow_continue","我方 · 镜头跟随中"],["friendly.camera_follow_end","我方 · 镜头跟随结束"],["friendly.formation_follow_start","我方 · 编队跟随开始"],["friendly.formation_follow_continue","我方 · 编队跟随中"],["friendly.formation_follow_end","我方 · 编队跟随结束"],
  ["enemy.attack","敌方 · 攻击"],["enemy.hit","敌方 · 受击"],["enemy.energy","敌方 · 能量不足"],["enemy.supplied","敌方 · 补给完成"],["enemy.return_battle","敌方 · 返回战场"],["enemy.repair_done","敌方 · 修理完成"],["enemy.failed","敌方 · 指令失败"],["enemy.skill","敌方 · 必杀技"],["enemy.lost","敌方 · 失能"],["enemy.idle","敌方 · 闲聊"],["enemy.praise","敌方 · 夸奖"]
];
const ADVISOR_EVENTS=[["left.warn","左手 · 装甲告警"],["left.loss","左手 · 战损"],["left.energy","左手 · 能量不足"],["right.progress","右手 · 进度过半"],["right.cheer","右手 · 击破欢呼"],["intro","战前开场"],["interlude","战前/中场过渡"],["groups","战斗互动组"],["scenes","战前场景"],["economy.open","后勤 · 打开"],["economy.no_credits","后勤 · 资源不足"],["economy.energy","后勤 · 能量不足"],["economy.done","后勤 · 完成"]];
const FACE_WANTED={hit:"0008",lost:"0008",failed:"0008",energy:"0008",supplied:"0002",return_battle:"0001",repair_done:"0002",attack:"0001",skill:"0001",idle:"0002",praise:"0002"};
const FACE_GROUP={hit:"hit",lost:"hit",failed:"hit",energy:"hit",attack:"attack",skill:"attack",idle:"idle",praise:"idle"};
const $=id=>document.getElementById(id); let rootHandle=null,teamsHandle=null,data=[],current=null,dialogue=null,currentEvent="",urls=new Map(),saving=false,saveTimer=0,version=0;
function status(t,bad=false){$("status").textContent=t;$("status").className="status"+(bad?" bad":"")}
function escString(s){return JSON.stringify(String(s)).replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029")}
function stripComments(s){return s.replace(/--\[(=*)\[[\s\S]*?\]\1\]/g,"").replace(/--[^\n\r]*/g,"")}
class LuaParser{constructor(s){this.s=stripComments(s);this.i=0} ws(){while(/\s/.test(this.s[this.i]||""))this.i++} peek(x){return this.s.slice(this.i,this.i+x.length)===x} word(){this.ws();let m=this.s.slice(this.i).match(/^[A-Za-z_][A-Za-z0-9_]*/);if(!m)throw Error("需要字段名");this.i+=m[0].length;return m[0]} string(){this.ws();let q=this.s[this.i++],out="";while(this.i<this.s.length){let c=this.s[this.i++];if(c===q)return out;if(c==="\\"){let n=this.s[this.i++];out+=({n:"\n",r:"\r",t:"\t",b:"\b",f:"\f"}[n]??n)}else out+=c}throw Error("字符串未闭合")} value(){this.ws();let c=this.s[this.i];if(c==="{ ".trim())return this.table();if(c==='"'||c==="'")return this.string();let m=this.s.slice(this.i).match(/^-?(?:\d+\.?\d*|\.\d+)/);if(m){this.i+=m[0].length;return Number(m[0])}let w=this.s.slice(this.i).match(/^[A-Za-z_][A-Za-z0-9_]*/);if(w){this.i+=w[0].length;if(w[0]==="true")return true;if(w[0]==="false")return false;if(w[0]==="nil")return null;return w[0]}throw Error("无法解析值")}
 table(){this.ws();if(this.s[this.i++]!=="{")throw Error("表缺少左括号");let e=[];while(true){this.ws();if(this.s[this.i]==="}"){this.i++;break}let k=null;let save=this.i;if(this.s[this.i]==="["){this.i++;let key=this.value();this.ws();if(this.s[this.i++]!=="]")throw Error("键缺少右括号");this.ws();if(this.s[this.i++]!=="=")throw Error("键缺少等号");k=key}else{let m=this.s.slice(this.i).match(/^[A-Za-z_][A-Za-z0-9_]*/);if(m){this.i+=m[0].length;this.ws();if(this.s[this.i]==="="){this.i++;k=m[0]}else this.i=save}}let v=this.value();e.push({k,v});this.ws();if(this.s[this.i]===","||this.s[this.i]===";")this.i++}return {t:"table",e}}
 parse(){this.ws();if(this.peek("return"))this.i+=6;this.ws();return this.value()}}
function parseLua(s){return new LuaParser(s).parse()}
function keyEq(a,b){return String(a)===String(b)}
function getKey(n,k){return n&&n.t==="table"?n.e.find(x=>x.k!==null&&keyEq(x.k,k))?.v:null}
function ensureTable(n,k){if(!n||n.t!=="table")throw Error("对白结构不是 table");let x=getKey(n,k);if(!x){x={t:"table",e:[]};n.e.push({k,v:x})}else if(x.t!=="table")throw Error("字段不是 table: "+k);return x}
function setKey(n,k,v){let x=n.e.find(x=>x.k!==null&&keyEq(x.k,k));if(x)x.v=v;else n.e.push({k,v})}
function pathParts(path){return path.split(".")}
function nodeAt(root,path,create=false){let n=root;for(const p of pathParts(path)){if(create)n=ensureTable(n,p);else n=getKey(n,p);if(!n)return null}return n}
function makeString(s){return String(s)}
function serialize(n,depth=0){if(n===null)return "nil";if(typeof n==="string")return escString(n);if(typeof n==="number"||typeof n==="boolean")return String(n);if(n&&n.t==="table"){let pad="  ".repeat(depth),inner=n.e.map(x=>{let v=serialize(x.v,depth+1);return (x.k===null?"":(typeof x.k==="string"&&/^[A-Za-z_][A-Za-z0-9_]*$/.test(x.k)?x.k:"["+serialize(x.k)+"]")+"=")+v}).join(",\n"+"  ".repeat(depth+1));return n.e.length?"{\n"+"  ".repeat(depth+1)+inner+"\n"+pad+"}":"{}"}return escString(n)}
function listNode(path){return nodeAt(dialogue,path)}
function ensureList(path){let n=nodeAt(dialogue,path,true);if(n.t!=="table")throw Error("事件不是列表");return n}
function textOf(n){return typeof n==="string"?n:(n&&n.t==="table"?String(getKey(n,"text")??""):"")}
function entryNode(text){return text}
function readTextFile(dir,name){return dir.getFileHandle(name).then(h=>h.getFile()).then(f=>f.text())}
async function optionalDir(dir,name){if(!dir)return null;try{return await dir.getDirectoryHandle(name)}catch(e){if(e.name==="NotFoundError")return null;throw e}}
async function dirs(dir){let a=[];if(dir)for await(const e of dir.values())if(e.kind==="directory")a.push(e);return a.sort((x,y)=>x.name.localeCompare(y.name))}
async function files(dir){let a=[];if(dir)for await(const e of dir.values())if(e.kind==="file")a.push(e);return a}
function charaCfg(text){let r={};for(const line of text.split(/\r?\n/)){let m=line.match(/^\s*([A-Za-z_]\w*)\s*=\s*["']([^"']*)/);if(m)r[m[1]]=m[2];else{m=line.match(/^\s*([A-Za-z_]\w*)\s*=\s*(-?\d+)/);if(m)r[m[1]]=m[2]}}return r}
async function scanVariant(team,skin,dir,baseDir){let tbl="",cfg={};try{tbl=await readTextFile(dir,"chara.tbl");cfg=charaCfg(tbl)}catch{}let faceDir=await optionalDir(dir,cfg.face||"face");let fs=await files(faceDir);let faceMap=new Map(fs.filter(f=>/\.png$/i.test(f.name)).map(f=>[f.name,f]));if(!faceMap.size)return null;let baseText="",baseCfg={};if(baseDir){try{baseText=await readTextFile(baseDir,"chara.tbl");baseCfg=charaCfg(baseText)}catch{}}let ddir=baseDir||dir;let dtext="";try{dtext=await readTextFile(ddir,"dialogue.lua")}catch{}if(!dtext)return null;return {team,skin,cid:dir.name,name:cfg.name||baseCfg.name||dir.name,dir,baseDir:ddir,faceDir,faceMap,cfg:{...baseCfg,...cfg},dialogueText:dtext,dialogueDir:ddir,path:`teams/${team.name}/${skin?"skins/"+skin.name+"/":""}chara/${dir.name}`}}
async function scanTeams(troot){let out=[];out.teams=new Map();for(const team of await dirs(troot)){out.teams.set(team.name,team);let base=await optionalDir(team,"chara");let baseChars=await dirs(base);for(const bd of baseChars){let v=await scanVariant(team,null,bd,bd);if(v)out.push(v)}let skins=await dirs(await optionalDir(team,"skins"));for(const skin of skins){let sc=await optionalDir(skin,"chara");for(const sd of await dirs(sc)){let baseDir=await optionalDir(base,sd.name);let v=await scanVariant(team,skin,sd,baseDir);if(v)out.push(v)}}}return out}
function avatarFile(c,kind){if(!c)return null;let group=FACE_GROUP[kind]||"normal",explicit=c.cfg["face_"+group];if(explicit){let name=explicit.replaceAll("\\","/").split("/").pop();if(c.faceMap.has(name))return name}let wanted=FACE_WANTED[kind]||"0000";for(const n of c.faceMap.keys())if(n.includes("_"+wanted))return n;for(const n of c.faceMap.keys())if(group!=="normal"&&n.toLowerCase().includes(group))return n;return c.faceMap.keys().next().value||null}
function avatarUrl(c,kind){let f=avatarFile(c,kind);return f?urls.get(c.path+"/"+f)||"": ""}
async function loadUrls(c){for(const [name,h] of c.faceMap){let key=c.path+"/"+name;if(!urls.has(key)){let b=await h.getFile();urls.set(key,URL.createObjectURL(b))}}}
function currentEvents(){return $("source").value==="advisor"?ADVISOR_EVENTS:EVENTS}
function fill(id,vals,keep=""){let el=$(id);el.replaceChildren(...vals.map(([v,l])=>new Option(l,v)));if(vals.some(x=>x[0]===keep))el.value=keep}
function refreshTeams(){let names=data.teams?[...data.teams.keys()]:[...new Set(data.map(c=>c.team.name))];fill("team",names.map(t=>[t,t]),$("team").value);refreshSkins()}
function refreshSkins(){let t=$("team").value;let skins=[...new Set(data.filter(c=>c.team.name===t).map(c=>c.skin?.name||""))];fill("skin",skins.map(s=>[s,s||"原皮（原版）"]),$("skin").value);refreshChars()}
function refreshChars(){let t=$("team").value,s=$("skin").value;let chars=data.filter(c=>c.team.name===t&&(c.skin?.name||"")===s);fill("chara",chars.map(c=>[c.cid,`${c.cid} · ${c.name}`]),$("chara").value);selectCurrent()}
async function selectCurrent(){let t=$("team").value,s=$("skin").value,id=$("chara").value;currentEvent="";dialogue=null;clearUrls();if($("source").value==="advisor"){let teamHandle=data.teams?.get(t),adir=await optionalDir(teamHandle,"advisor");current=teamHandle?{team:teamHandle,skin:null,cid:"advisor",name:t+" 顾问",path:`teams/${t}/advisor`,advisor:true,advisorDir:adir,roles:{}}:null;if(!current||!adir){current=null;$("context").textContent="该队伍没有 advisor/dialogue.lua";renderAll();return}try{current.dialogueText=await readTextFile(adir,"dialogue.lua");let tt="";try{tt=await readTextFile(teamHandle,"team.tbl")}catch{}current.roles=charaCfg(tt);dialogue=parseLua(current.dialogueText);$("context").textContent=`${t} 顾问 · ${current.path}/dialogue.lua`;$("skinNote").classList.add("hidden");let av=[advisorAvatar("left"),advisorAvatar("right"),advisorAvatar("commander")].filter(Boolean);await Promise.all(av.map(loadUrls));renderAll()}catch(e){status("顾问对白读取失败："+e.message,true);renderAll()}return}
current=data.find(c=>c.team.name===t&&(c.skin?.name||"")===s&&c.cid===id)||null;if(current){dialogue=parseLua(current.dialogueText);$("context").textContent=`${current.name} · ${s||"原皮（原版）"} · ${current.path}/dialogue.lua`;if(s){$("skinNote").textContent="当前选择的是皮肤：头像按皮肤目录预览，台词仍编辑原皮角色的 dialogue.lua。";$("skinNote").classList.remove("hidden")}else $("skinNote").classList.add("hidden");loadUrls(current).then(()=>renderAll()).catch(e=>status("头像读取失败："+e.message,true))}else{$("context").textContent="没有可编辑角色";renderAll()}}
function clearUrls(){for(const u of urls.values())URL.revokeObjectURL(u);urls.clear()}
function renderEvents(){let host=$("events");host.replaceChildren();for(const [path,label] of currentEvents()){let b=document.createElement("button");b.className="event"+(path===currentEvent?" active":"");let n=listNode(path),count=n&&n.t==="table"?n.e.length:0;b.innerHTML=`<span>${label}</span><span>${count?count+" 条":"未配置"}</span>`;b.onclick=()=>{currentEvent=path;renderAll()};host.append(b)}}
function advisorAvatar(role){if(!current?.advisor)return null;let id=current.roles?.[role];if(!id)return null;let skin=$("skin").value||"";return data.find(c=>c.team.name===$("team").value&&(c.skin?.name||"")===skin&&c.cid===String(id).padStart(3,"0"))||data.find(c=>c.team.name===$("team").value&&!c.skin&&c.cid===String(id).padStart(3,"0"))||null}
function advisorFace(role){let c=advisorAvatar(role);if(!c)return "";let f=avatarFile(c,"idle");return f?urls.get(c.path+"/"+f)||"":""}
function advisorRow(host,label,node,onChange,index){let row=document.createElement("div");row.className="row";let num=document.createElement("div");num.className="row-num";num.textContent=label;let area=document.createElement("textarea");area.value=textOf(node);area.placeholder="输入台词…";area.oninput=()=>{if(node&&node.t==="table")setKey(node,"text",entryNode(area.value));else onChange(entryNode(area.value));queueSave()};row.append(num,area);host.append(row)}
function renderAdvisorRows(){let host=$("rows");host.replaceChildren();let n=listNode(currentEvent);if(!current||!n||n.t!=="table"){host.innerHTML='<div class="empty">这个事件还没有台词，点击“添加台词”创建第一条。</div>';return}if(currentEvent==="groups"){n.e.forEach((entry,i)=>{let group=entry.v;if(!group||group.t!=="table")return;let row=document.createElement("div");row.className="row";let num=document.createElement("div");num.className="row-num";num.textContent=i+1;let box=document.createElement("div");box.style.display="grid";box.style.gap="6px";for(const role of ["left","right"]){let area=document.createElement("textarea");area.value=textOf(getKey(group,role));area.placeholder=role==="left"?"左手台词…":"右手台词…";area.oninput=()=>{let old=getKey(group,role);if(old&&old.t==="table")setKey(old,"text",entryNode(area.value));else setKey(group,role,entryNode(area.value));queueSave()};box.append(area)}let del=document.createElement("button");del.textContent="删除这一组";del.onclick=()=>{n.e.splice(i,1);queueSave();renderAll()};box.append(del);row.append(num,box);host.append(row)});return}if(currentEvent==="scenes"){n.e.forEach((scene,si)=>{if(!scene.v||scene.v.t!=="table")return;scene.v.e.forEach((entry,li)=>{let obj=entry.v;if(!obj||obj.t!=="table")return;let row=document.createElement("div");row.className="row";let num=document.createElement("div");num.className="row-num";num.textContent=`${si+1}.${li+1}`;let box=document.createElement("div");box.style.display="grid";box.style.gap="6px";let id=document.createElement("input");id.value=String(getKey(obj,"id")??"");id.placeholder="角色编号";id.oninput=()=>{let v=Number(id.value);setKey(obj,"id",Number.isFinite(v)&&id.value!==""?v:id.value);queueSave()};let area=document.createElement("textarea");area.value=textOf(obj);area.placeholder="战前台词…";area.oninput=()=>{setKey(obj,"text",entryNode(area.value));queueSave()};let del=document.createElement("button");del.textContent="删除台词";del.onclick=()=>{scene.v.e.splice(li,1);queueSave();renderAll()};box.append(id,area,del);row.append(num,box);host.append(row)})});return}n.e.forEach((entry,i)=>{let row=document.createElement("div");row.className="row";let num=document.createElement("div");num.className="row-num";num.textContent=i+1;let area=document.createElement("textarea");area.value=textOf(entry.v);area.placeholder="输入台词…";area.oninput=()=>{if(entry.v&&entry.v.t==="table")setKey(entry.v,"text",entryNode(area.value));else entry.v=entryNode(area.value);queueSave()};row.append(num,area);host.append(row)})}
function renderRows(){let host=$("rows");host.replaceChildren();if(current?.advisor){renderAdvisorRows();return}let n=listNode(currentEvent);if(!current||!n||n.t!=="table"){host.innerHTML='<div class="empty">这个事件还没有台词，点击“添加台词”创建第一条。</div>';return}n.e.forEach((entry,i)=>{let row=document.createElement("div");row.className="row";let num=document.createElement("div");num.className="row-num";num.textContent=i+1;let area=document.createElement("textarea");area.value=textOf(entry.v);area.placeholder="输入台词…";area.oninput=()=>{if(entry.v&&entry.v.t==="table")setKey(entry.v,"text",entryNode(area.value));else entry.v=entryNode(area.value);queueSave()};let actions=document.createElement("div");actions.className="row-actions";for(const [label,fn] of [["↑",()=>moveEntry(n,i,-1)],["↓",()=>moveEntry(n,i,1)],["×",()=>{n.e.splice(i,1);queueSave();renderAll()}]]){let b=document.createElement("button");b.textContent=label;b.title=label==="×"?"删除":"调整顺序";b.onclick=fn;actions.append(b)}row.append(num,area,actions);host.append(row)})}
function moveEntry(n,i,d){let j=i+d;if(j<0||j>=n.e.length)return;[n.e[i],n.e[j]]=[n.e[j],n.e[i]];queueSave();renderAll()}
function renderPreview(){let host=$("preview");host.replaceChildren();if(!current){host.innerHTML='<div class="empty">暂无角色</div>';return}let kind=currentEvent.split(".").pop(),role=currentEvent.startsWith("left.")?"left":currentEvent.startsWith("right.")?"right":"commander";let c=current.advisor?advisorAvatar(role):current;let img=document.createElement("img");img.className="avatar";img.src=current.advisor?advisorFace(role):avatarUrl(current,kind);img.alt=c?.name||current.name;let card=document.createElement("div");card.className="preview-card";let body=document.createElement("div");body.innerHTML=`<strong>${c?.name||current.name}</strong><span class="chip">${$("skin").value||"原皮"}</span><p class="path">事件：${kind}<br>头像：${current.advisor?(avatarFile(c,"idle")||"按队伍左右手绑定"): (avatarFile(current,kind)||"自动回退")}</p>`;card.append(img,body);host.append(card);if(current.advisor){let p=document.createElement("p");p.className="hint";p.textContent="顾问左右手头像按队伍 team.tbl 的 left/right 角色编号解析；战前场景中的 id 由每条场景台词指定。";host.append(p)}}
function renderAll(){renderEvents();let label=currentEvents().find(x=>x[0]===currentEvent)?.[1]||"请选择事件";$("eventTitle").textContent=label;$("eventPath").textContent=currentEvent?`路径：${currentEvent}`:"";let canAdd=!current||!currentEvent?false:(current.advisor?(currentEvent==="groups"||currentEvent==="scenes"||currentEvent==="interlude"):true);$("add").disabled=!canAdd;$("reload").disabled=!current;renderRows();renderPreview()}
function queueSave(){if(!current||!dialogue||saving)return;clearTimeout(saveTimer);saveTimer=setTimeout(save,500);status("有修改，等待自动保存…")}
async function save(){if(!current||!dialogue)return;saving=true;$("add").disabled=true;status("正在自动保存…");try{let text="return "+serialize(dialogue)+"\n";let owner=current.advisor?current.advisorDir:current.baseDir;let h=await owner.getFileHandle("dialogue.lua",{create:true});let old=await h.getFile();let oldText=await old.text();if(oldText!==current.dialogueText&&oldText!==text)throw Error("文件已被其他窗口修改，请重新载入");let w=await h.createWritable();await w.write(text);await w.close();current.dialogueText=text;status("已自动保存 ✓")}catch(e){status("保存失败："+e.message,true)}finally{saving=false;renderAll()}}
function reload(){if(!current)return;try{dialogue=parseLua(current.dialogueText);renderAll();status("已重新载入") }catch(e){status("读取失败："+e.message,true)}}
if(typeof window!=="undefined")window.DialogueEditor={parseLua,serialize,avatarFile,FACE_GROUP,FACE_WANTED};
if(typeof document!=="undefined"){
$("add").onclick=()=>{let n=ensureList(currentEvent);if(current?.advisor&&currentEvent==="groups"){n.e.push({k:null,v:{t:"table",e:[{k:"left",v:""},{k:"right",v:""}]}})}else if(current?.advisor&&currentEvent==="scenes"){n.e.push({k:null,v:{t:"table",e:[{k:null,v:{t:"table",e:[{k:"id",v:0},{k:"text",v:""}]}}]}})}else n.e.push({k:null,v:""});renderAll();queueSave();setTimeout(()=>$("rows textarea:last-of-type")?.focus(),0)};
$("reload").onclick=reload;$("team").onchange=refreshSkins;$("skin").onchange=refreshChars;$("chara").onchange=selectCurrent;$("source").onchange=()=>{currentEvent="";selectCurrent()};
$("open").onclick=async()=>{if(!window.showDirectoryPicker){status("请使用桌面版 Chrome / Edge 打开此 HTML；无需 Python 或 8080 服务。",true);return}try{rootHandle=await showDirectoryPicker({mode:"readwrite",id:"rts-dialogue-studio"});teamsHandle=rootHandle.name==="teams"?rootHandle:await optionalDir(rootHandle,"teams");if(!teamsHandle)throw Error("请选择 rts_game 或 teams 文件夹");status("正在扫描角色、皮肤和头像…");data=await scanTeams(teamsHandle);refreshTeams();status(data.length?`就绪 · ${data.length} 个角色/皮肤条目`:"没有找到可编辑角色")}catch(e){if(e.name!=="AbortError")status(e.message,true)}};
window.addEventListener("beforeunload",e=>{if(saving||saveTimer){e.preventDefault();e.returnValue=""}});renderAll();
}
</script>
</body></html>
